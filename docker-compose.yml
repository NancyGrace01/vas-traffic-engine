version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vas_engine
      POSTGRES_USER: vasadmin
      POSTGRES_PASSWORD: vasdevpassword
    ports:
      - "5432:5432"
    volumes:
      - vas_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vas_redisdata:/data

  # Uncomment after npm install to run the API locally
  # api:
  #   build: .
  #   container_name: vas_api
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   env_file: .env
  #   depends_on:
  #     - postgres
  #     - redis

volumes:
  vas_pgdata:
  vas_redisdata:
